name: PR Review Reminder

on:
  schedule:
    # Runs every 3 minutes. This is NOT how often people get pinged —
    # it's just how often we check "has any open PR just crossed the 2h or
    # 24h mark since it was created?" The script (reminder.js) does that
    # math and only sends a message at those two specific checkpoints per
    # PR, timed from its own creation time, not from a fixed clock.
    #
    # If you change this interval, also update RUN_INTERVAL_MINUTES at the
    # top of notifications/reminder.js to match, or the boundary-detection
    # math will drift.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run PR reminder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node notifications/reminder.js